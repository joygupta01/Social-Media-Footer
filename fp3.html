<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="https://kit.fontawesome.com/c500102a0d.js" crossorigin="anonymous"></script>
</head>

<body>
    <div id="social-media" class="container-fluid">
        <div class="container-fluid text-primary py-4">
            <h1 class="text-danger">Hello All !</h1>
            <div class="row pt-5">
                <div class="col-3 media-link btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h1>Facebook</h1>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-brands fa-facebook"></i>
                        </div>
                    </div>
                </div>

                <div class="col-2.4 media-link btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h1>LinkedIn</h1>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-brands fa-linkedin"></i>
                        </div>
                    </div>
                </div>

                <div class="col-2.4 media-link btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h1>Instagram</h1>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-brands fa-square-instagram"></i>
                        </div>
                    </div>
                </div>

                <div class="col-2.4 media-link btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h1>GitHub</h1>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-brands fa-github"></i>
                        </div>
                    </div>
                </div>

                <div class="col-2.4 media-link btn" href="#">
                    <div class="row">
                        <div class="col-6 d-flex justify-content-start">
                            <h1>Email</h1>
                        </div>
                        <div class="col-6 d-flex justify-content-end align-items-center">
                            <i class="fa-solid fa-envelope"></i>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <div class="container text-muted text-center py-3 mt-5">
            <h5>
                Copyright &copy; 2025 |
                <a class="text-primary">All Rights Reserved</a>
            </h5>
        </div>
    </footer>
</body>

</html>
